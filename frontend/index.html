<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediTrack | Medicine Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">
    <main class="main-area">
      <header class="site-header">
        <div class="topbar">
          <a class="brand top-brand" href="#dashboard" onclick="event.preventDefault();showPage('dashboard')">
            <span class="brand-icon"><i class="bi bi-capsule-pill"></i></span>
            <span>MediTrack<small>INVENTORY SYSTEM</small></span>
          </a>
          <div class="top-actions"><span class="today" id="today"></span>
            <div class="notif-wrap">
              <button class="icon-button" id="bellBtn" type="button" title="Notifications" onclick="toggleNotifications(event)"><i class="bi bi-bell"></i>
                <span id="notifDot"></span>
              </button>
              <div class="notif-dropdown" id="notifDropdown"></div>
            </div>
            <div class="top-user"><span class="avatar">AD</span>
              <span><strong>Admin User</strong><small>Administrator</small></span><button class="btn btn-sm btn-light"
                onclick="showPage('login')" title="Log out"><i class="bi bi-box-arrow-right"></i></button></div>
          </div>
        </div>
        <nav class="top-navigation" id="navigation" aria-label="Main navigation"></nav>
        <div class="breadcrumb-bar"><span>Workspace</span><i class="bi bi-chevron-right"></i><strong
            id="crumb">Dashboard</strong></div>
      </header>
      <div class="page-wrap">
        <div id="pageContent"></div>
        <footer>© 2026 MediTrack · Medicine inventory & expiry tracking</footer>
      </div>
    </main>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="status">
      <div class="toast-body" id="toastMessage">Saved</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
